<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishaan Agastya</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');

        :root {
            --purple: #a855f7;
            --dark: #0a0a0a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow-x: hidden;
            cursor: none;
        }
        h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }

        /* Floating Glassmorphic Header */
        header {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 14px 50px;
            background: rgba(15, 15, 25, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 60px;
            box-shadow: 0 10px 40px rgba(168, 85, 247, 0.15);
            display: flex;
            align-items: center;
            gap: 50px;
        }
        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            color: white;
        }
        nav a {
            color: #ddd;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }
        nav a:hover { color: var(--purple); text-shadow: 0 0 10px var(--purple); }

        /* Custom Cursor */
        .cursor {
            position: fixed;
            width: 22px;
            height: 22px;
            border: 2px solid var(--purple);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.08s;
        }
        .cursor::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--purple);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 1.2s ease;
        }
        .loading-container {
            width: 420px;
            text-align: center;
        }
        .loading-text {
            font-size: 1.4rem;
            margin-bottom: 30px;
            color: #c4b5fd;
            letter-spacing: 2px;
        }
        .progress-bar-bg {
            height: 6px;
            background: rgba(168, 85, 247, 0.2);
            border-radius: 50px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a855f7, #c4b5fd);
            box-shadow: 0 0 20px #a855f7;
            transition: width 0.08s linear;
        }
        #three-laptop {
            width: 280px;
            height: 180px;
            margin-bottom: 40px;
        }

        section { padding: 140px 5% 100px; max-width: 1200px; margin: 0 auto; }
        h2 { font-size: 3.2rem; text-align: center; margin-bottom: 80px; color: #c4b5fd; }

        .glass-card {
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 24px;
            padding: 32px;
            transition: all 0.4s;
        }
        .glass-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 30px 70px rgba(168, 85, 247, 0.3);
        }
    </style>
</head>
<body>

    <!-- Floating Glass Header -->
    <header>
        <div class="logo">Ishaan Agastya</div>
        <nav>
            <a href="#mindset">The Mindset</a>
            <a href="#skills">Skill Matrix</a>
            <a href="#creations">Creations</a>
            <a href="#lab">The Lab</a>
            <a href="#access">Access Point</a>
        </nav>
    </header>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-container">
            <canvas id="three-laptop"></canvas>
            <div class="loading-text">INITIALIZING SYSTEM...</div>
            <div class="progress-bar-bg">
                <div id="progress" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Hero -->
    <section id="hero" style="height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden;">
        <canvas id="canvas"></canvas>
        <div style="z-index: 2;">
            <h1 style="font-size: 5.8rem; line-height: 1.05; background: linear-gradient(90deg, #fff, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                Ishaan Agastya
            </h1>
            <p style="font-size: 1.9rem; margin: 20px 0 10px; color: #ddd;">Exploring Ideas. Building Systems. Becoming Limitless.</p>
            <p style="font-size: 1.3rem; max-width: 620px; margin: 0 auto; opacity: 0.85;">A student driven by curiosity, creation, and continuous evolution.</p>
        </div>
    </section>

    <!-- Rest of sections (Mindset, etc.) remain same for now -->

    <div id="click-particles"></div>

    <script>
        // Custom Cursor + Click Particles (same as before)
        const cursor = document.createElement('div');
        cursor.className = 'cursor';
        document.body.appendChild(cursor);

        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        function createClickParticles(x, y) {
            const container = document.getElementById('click-particles') || document.body;
            for (let i = 0; i < 16; i++) {
                const p = document.createElement('div');
                p.style.position = 'fixed';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.width = '5px';
                p.style.height = '5px';
                p.style.background = '#f8f8f8';
                p.style.borderRadius = '50%';
                p.style.opacity = '0.85';
                p.style.pointerEvents = 'none';
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const vel = 3 + Math.random() * 5;
                let life = 30;
                const anim = setInterval(() => {
                    life--;
                    p.style.transform = `translate(${Math.cos(angle)*vel*(30-life)}px, ${Math.sin(angle)*vel*(30-life)-life*1.5}px)`;
                    p.style.opacity = life / 30;
                    if (life <= 0) { clearInterval(anim); p.remove(); }
                }, 16);
            }
        }
        document.addEventListener('click', e => createClickParticles(e.clientX, e.clientY));

        // Loading Screen with 3D Laptop + Progress + Whoosh
        let loadingProgress = 0;
        const progressBar = document.getElementById('progress');
        const loadingScreen = document.getElementById('loading-screen');

        function simulateLoading() {
            const interval = setInterval(() => {
                loadingProgress += Math.random() * 12 + 5;
                if (loadingProgress > 100) loadingProgress = 100;
                progressBar.style.width = loadingProgress + '%';

                if (loadingProgress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loadingScreen.style.opacity = '0';
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                        }, 1200);
                    }, 600);
                }
            }, 80);
        }

        // Simple 3D Laptop in loading (using Three.js)
        function initLaptopLoader() {
            const canvas = document.getElementById('three-laptop');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, 280/180, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(280, 180);

            // Laptop body (simple box)
            const laptopGeo = new THREE.BoxGeometry(4, 2.5, 0.3);
            const laptopMat = new THREE.MeshPhongMaterial({ color: 0x1a1a2e, shininess: 80 });
            const laptop = new THREE.Mesh(laptopGeo, laptopMat);
            scene.add(laptop);

            // Screen
            const screenGeo = new THREE.PlaneGeometry(3.6, 2.1);
            const screenMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const screen = new THREE.Mesh(screenGeo, screenMat);
            screen.position.set(0, 0.1, 0.16);
            laptop.add(screen);

            // Light
            const light = new THREE.PointLight(0xa855f7, 2);
            light.position.set(5, 8, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            camera.position.set(0, 2, 8);
            camera.lookAt(0, 0, 0);

            let rot = 0;
            function animateLaptop() {
                requestAnimationFrame(animateLaptop);
                rot += 0.008;
                laptop.rotation.y = Math.sin(rot) * 0.25;
                renderer.render(scene, camera);
            }
            animateLaptop();
        }

        // Main 3D Background (more aesthetic purple)
        let scene, camera, renderer, particlesArray = [];

        function initMainScene() {
            const canvas = document.getElementById('canvas');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const geo = new THREE.SphereGeometry(0.15, 14, 14);
            const mat = new THREE.MeshBasicMaterial({ color: 0xa855f7 });

            for (let i = 0; i < 320; i++) {
                const p = new THREE.Mesh(geo, mat);
                p.position.set(
                    Math.random() * 90 - 45,
                    Math.random() * 90 - 45,
                    Math.random() * 70 - 35
                );
                p.userData = { speed: 0.025 + Math.random() * 0.045, baseColor: 0xa855f7 };
                scene.add(p);
                particlesArray.push(p);
            }

            camera.position.z = 40;

            function animate() {
                requestAnimationFrame(animate);
                const scrollProg = Math.min(window.scrollY / 1000, 1);

                particlesArray.forEach(p => {
                    p.position.y -= p.userData.speed;
                    if (p.position.y < -50) p.position.y = 50;

                    const r = 0.65 * (1 - scrollProg * 0.6);
                    const g = 0.33 * (1 - scrollProg * 0.8);
                    p.material.color.setRGB(r, g, 1);
                });

                camera.position.y = -window.scrollY * 0.018;
                renderer.render(scene, camera);
            }
            animate();
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Start everything
        window.onload = () => {
            initLaptopLoader();
            simulateLoading();
            initMainScene();
        };
    </script>
</body>
</html>
